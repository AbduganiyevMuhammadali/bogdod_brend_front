<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS Dashboard</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c42eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sellz" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Vue mount bo'lguncha ko'rinadigan boshlang'ich yuklanish ekrani —
         Vue o'zi ishga tushmasdan turib brauzer buni darhol chizadi,
         shuning uchun ilk yuklanishda oq ekran ko'rinmaydi. Vue mount
         bo'lgach main.js #initial-loader elementini olib tashlaydi. */
      #initial-loader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background: linear-gradient(175deg, #1e1b4b 0%, #1a1740 60%, #16143a 100%);
      }
      #initial-loader .il-logo {
        display: flex; align-items: center; justify-content: center;
        width: 64px; height: 64px; border-radius: 18px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 8px 28px rgba(99,102,241,0.45);
        animation: il-pulse 1.6s ease-in-out infinite;
      }
      #initial-loader .il-logo svg { width: 32px; height: 32px; }
      #initial-loader .il-spinner {
        width: 28px; height: 28px; border-radius: 999px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #a5b4fc;
        animation: il-spin 0.8s linear infinite;
      }
      #initial-loader .il-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
        color: rgba(226,232,240,0.6);
      }
      @keyframes il-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes il-spin  { to { transform: rotate(360deg); } }
      #initial-loader.il-hide { opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="initial-loader">
      <div class="il-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
      </div>
      <div class="il-spinner"></div>
      <p class="il-text">Sellz yuklanmoqda...</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
